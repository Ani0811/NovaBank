[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novabank"
version = "0.1.0"
description = "Modern Python Bank Management Desktop System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NovaBank Engineering Team" }
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "alembic>=1.13",
    "PySide6>=6.6",
    "keyring>=24.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4"]
ignore = ["E501"]
